name: forecast-ledger

# Weekly: fetch live observations, issue a frozen projection for any fit
# whose fingerprint (lt.exe.p, lt.exe.resp, .dat, lte_run.sh, lte_forward.py,
# engines.py) changed, refit LOD / Chandler monthly, score every projection
# against observations and persistence / AR1 / climatology baselines, and
# commit the results.  Git history is the timestamp.
# DISABLED 2026-10-15: this version projects with lte_forward.py, which does not
# reproduce the fits. Replaced by the Ada (lt.exe) engine. Manual runs only until then.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "space-separated target or group names (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: forecast-ledger
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pyyaml netCDF4
      - uses: actions/cache@v4
        with:
          path: forecast/.cache
          key: obs-cache-${{ github.run_id }}
          restore-keys: obs-cache-
      - name: Run ledger
        run: |
          T="${{ github.event.inputs.targets }}"
          if [ -n "$T" ]; then python3 forecast/ledger.py all -t $T
          else python3 forecast/ledger.py all; fi
          python3 forecast/ledger.py backfill   # idempotent: only missing origins
      - name: Commit results
        run: |
          git config user.name  "forecast-ledger[bot]"
          git config user.email "forecast-ledger@users.noreply.github.com"
          git add forecast/ledger forecast/observations forecast/scores forecast/REPORT.md
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "forecast-ledger: $(date -u +%Y-%m-%d) update"
          git push
